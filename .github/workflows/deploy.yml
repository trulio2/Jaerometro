name: Deploy to GitHub Pages

on:
  push:
    branches: ['master']
    paths:
      - 'front/**'
  schedule:
    - cron: '15 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the data branch
    defaults:
      run:
        working-directory: front
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'yarn'
          cache-dependency-path: 'front/yarn.lock'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install data tooling
        working-directory: .
        run: pip install -r scripts/requirements.txt

      # Stored source history lives on the `data` branch, outside master's
      # history. It is checked out as a worktree so the script can update it.
      - name: Load stored history
        working-directory: .
        run: |
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth=1 origin data:data
            git worktree add data-store data
          else
            git worktree add --orphan -b data data-store
          fi

      - name: Refresh dashboard snapshot
        id: refresh
        continue-on-error: true
        working-directory: .
        env:
          JAEROMETRO_DATA_DIR: data-store
        run: python scripts/fetch_dashboard.py

      - name: Save history
        if: steps.refresh.outcome == 'success'
        working-directory: data-store
        run: |
          cp ../front/public/data/dashboard.json dashboard.json
          git add -A

          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi

          git -c user.name="github-actions[bot]" \
            -c user.email="41898283+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "data: refresh $(date -u +%F)"
          git push origin data

      # If the refresh crashed outright, ship the last snapshot that worked.
      - name: Fall back to last snapshot
        if: steps.refresh.outcome == 'failure'
        working-directory: .
        run: |
          echo "::warning::Snapshot refresh failed; deploying the last saved snapshot."
          mkdir -p front/public/data
          cp data-store/dashboard.json front/public/data/dashboard.json

      - name: Lint
        run: yarn lint

      - name: Build project
        run: yarn build
        env:
          VITE_IMPOSTOMETRO_PROXY_URL: ${{ vars.VITE_IMPOSTOMETRO_PROXY_URL }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'front/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
